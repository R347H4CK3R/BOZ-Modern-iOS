name: Build unsigned BOZ
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-unsigned.yml'
      - 'tools/fix_container_image.py'
      - 'tools/integrate_diagnostics.py'
      - 'tools/check_loader_compatibility.py'
      - 'tools/normalize_marmalade.py'
      - 'src/BOZDiagnostics.m'
      - 'src/BOZStartupTrace.m'
      - 'src/BOZEngineTrace.m'
      - 'src/fishhook.c'
      - 'src/fishhook.h'
concurrency:
  group: boz-unsigned-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned repair source
        run: |
          git clone https://github.com/Producdevity/cod-boz-ios.git repair
          git -C repair checkout de2574afbe3ff7811989f3fb4b38da373049ef0a
      - name: Download private input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download source-input --repo "${{ github.repository }}" --pattern 'boz-v1.3.5.ipa' --dir .
          echo 'b7eba04a7ccf957a7530e65164b33f6cb7151827160de37ff11b775f6cef332d  boz-v1.3.5.ipa' | shasum -a 256 --check
      - name: Install firmware extraction tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipsw-bin"
          gh release download v3.1.741 --repo blacktop/ipsw --pattern 'ipsw_3.1.741_macOS_arm64.tar.gz' --pattern checksums.txt --dir "$RUNNER_TEMP/ipsw-bin"
          (cd "$RUNNER_TEMP/ipsw-bin" && grep ' ipsw_3.1.741_macOS_arm64.tar.gz$' checksums.txt | shasum -a 256 --check)
          tar -xzf "$RUNNER_TEMP/ipsw-bin/ipsw_3.1.741_macOS_arm64.tar.gz" -C "$RUNNER_TEMP/ipsw-bin"
          chmod +x "$RUNNER_TEMP/ipsw-bin/ipsw"
          echo "$RUNNER_TEMP/ipsw-bin" >> "$GITHUB_PATH"
      - name: Fix guest image lookup for containers
        run: python3 tools/fix_container_image.py
      - name: Integrate persistent diagnostics
        run: python3 tools/integrate_diagnostics.py
      - name: Build compatibility repair
        run: bash repair/build-fixed-ipa.sh "$PWD/boz-v1.3.5.ipa"
      - name: Remove embedded signatures and validate package
        run: |
          mkdir verify
          unzip -q repair/boz-v1.3.5-mp.ipa -d verify
          cp src/FISHHOOK-LICENSE verify/Payload/blackops.app/ThirdParty-Fishhook.txt
          python3 tools/normalize_marmalade.py verify/Payload/blackops.app/blackops
          plutil -replace CFBundleVersion -string 135.6 verify/Payload/blackops.app/Info.plist
          plutil -replace CFBundleDisplayName -string 'COD:BOZ Trace v3' verify/Payload/blackops.app/Info.plist
          find verify/Payload -type f | while IFS= read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              codesign --remove-signature "$f" || exit 1
              if codesign -d "$f" 2>/dev/null; then
                echo "Unexpected signature: $f"; exit 1
              fi
            fi
          done
          test "$(lipo -archs verify/Payload/blackops.app/blackops)" = arm64
          test -f verify/Payload/blackops.app/Frameworks/libstdc++.6.dylib
          test -f verify/Payload/blackops.app/Frameworks/BOZFullscreenFix.dylib
          python3 tools/check_loader_compatibility.py verify/Payload/blackops.app/blackops
          plutil -lint verify/Payload/blackops.app/Info.plist
          (cd verify && zip -qry -X ../BOZ-Modern-iOS-unsigned.ipa Payload)
          unzip -t BOZ-Modern-iOS-unsigned.ipa
          shasum -a 256 BOZ-Modern-iOS-unsigned.ipa > BOZ-Modern-iOS-unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BOZ-Modern-iOS-unsigned
          path: |
            BOZ-Modern-iOS-unsigned.ipa
            BOZ-Modern-iOS-unsigned.sha256
          retention-days: 14
      - name: Record verified build metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'verified-run=${{ github.run_id }}' >> "$GITHUB_STEP_SUMMARY"
