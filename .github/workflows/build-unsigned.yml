name: Build unsigned BOZ
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-unsigned.yml'
      - 'tools/package_loader_repair.py'
      - 'tools/fix_marmalade_scanner.py'
      - 'tests/test_marmalade_scanner.py'
concurrency:
  group: boz-unsigned-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned seed/loader helpers
        run: |
          git clone https://github.com/Producdevity/cod-boz-ios.git repair
          git -C repair checkout de2574afbe3ff7811989f3fb4b38da373049ef0a
      - name: Download checksum-pinned unsigned baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download engine-trace-v4 --repo "${{ github.repository }}" --pattern BOZ-Modern-iOS-unsigned.ipa --dir baseline
          echo '3ca0cac43d70e806125ae2129c29f067cb9f3b32d40e34984a6e3f875c00d27e  baseline/BOZ-Modern-iOS-unsigned.ipa' | sha256sum --check
      - name: Apply scanner repair and preserve unsigned assets/libraries
        run: python3 tools/package_loader_repair.py baseline/BOZ-Modern-iOS-unsigned.ipa BOZ-Modern-iOS-unsigned.ipa
      - name: Verify loader compatibility and ARM64 regression
        run: |
          python3 tools/check_loader_compatibility.py verify/blackops
          python3 -m venv "$RUNNER_TEMP/boz-tests"
          "$RUNNER_TEMP/boz-tests/bin/python" -m pip install unicorn==2.1.4
          "$RUNNER_TEMP/boz-tests/bin/python" tests/test_marmalade_scanner.py verify/blackops
          sha256sum BOZ-Modern-iOS-unsigned.ipa > BOZ-Modern-iOS-unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BOZ-Modern-iOS-unsigned
          path: |
            BOZ-Modern-iOS-unsigned.ipa
            BOZ-Modern-iOS-unsigned.sha256
          retention-days: 14
